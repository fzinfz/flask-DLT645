{% extends "base.html" %}

{% block title %}电表系统{% endblock %}

{% block topnav %}
<div class="home-link"><a href="/">&#127968; 首页</a></div>
{% endblock %}

{% block content %}
<style>
.cards {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 80px;
  flex-wrap: wrap;
}
.card {
  background-color: #f8f9fa;
  border: 2px solid #dee2e6;
  border-radius: 16px;
  width: 280px;
  height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #333;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
.card-icon {
  font-size: 60px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 32px;
  font-weight: bold;
}
</style>

<div class="cards">
  <a href="/meters/" class="card">
    <div class="card-icon">&#9889;</div>
    <div class="card-title">读数</div>
  </a>
  <a href="/power/" class="card">
    <div class="card-icon">&#128161;</div>
    <div class="card-title">功率</div>
  </a>
</div>
{% endblock %}
